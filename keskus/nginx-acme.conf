# /etc/nginx/conf.d/acme.conf  (keskuspalvelin)
# Palomuuri ohjaa (DNAT) julkisten osoitteiden portin 80 tänne.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    # Kaikki muu :80-liikenne HTTPS:ään samalle domainille
    location / { return 301 https://$host$request_uri; }
}
