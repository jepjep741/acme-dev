# /etc/cert-install.conf  (root:root 0644)
STAGING=/var/lib/vault-agent/staging
TARGET=/etc/ssl/acme
DVV_CA=/etc/cert-install/dvv-ca.pem          # DVV:n juuri-CA (luottamusankkuri tarkistukselle)
MIN_VALID_SECONDS=604800                     # hylkää varmenne, joka vanhenee alle 7 pv:ssä
TEST_CMD="nginx -t"                          # Apache: "apachectl configtest"
RELOAD_CMD="systemctl reload nginx"          # Apache: "systemctl reload apache2"
