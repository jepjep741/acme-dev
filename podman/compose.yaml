# DVV ACME -keskuspalvelin, rootless Podman (podman-compose).
# Ajetaan palvelukäyttäjänä (acmesvc). Ei salaisuuksia tässä tiedostossa eikä .env:ssä:
# salaisuudet ovat podman secretejä (scripts/secrets.sh) ja näkyvät kontissa /run/secrets/.
#
#   podman-compose up -d                 # nginx + vault
#   podman-compose --profile jobs run --rm lego   # ACME-uusinta (systemd: acme-renew.timer)
#
# Verkot:
#   edge   internal  nginx   ei reittiä ulos eikä isäntään (vain julkaistu :8080)
#   host   isännän   vault   kuuntelee VAIN VAULT_BIND_IP:VAULT_PUBLISH_PORT. Isännän verkko, jotta
#                            Vault näkee agenttien todellisen IP:n (AppRole-CIDR-sidonta); rootless-
#                            portinohjaus (rootlessport) korvaisi lähdeosoitteen kontin osoitteella.
#   host   isännän   lego    tavoittaa Vaultin (VAULT_BIND_IP) ja DVV:n. Isäntä rajaa palvelukäyttäjän
#                            ulosmenevän liikenteen nftablesilla (install-host.sh: vain DVV + DNS).
name: acme

# Ei podia: kontit omissa verkkonimiavaruuksissaan ilman ryhmittelyä, jotta valvonta- ja
# tarkistustyökalut (egress-check.sh) voivat liittyä kontin verkkoon (--network container:).
x-podman:
  in_pod: false

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pull_policy: never

services:
  nginx:
    <<: *hardening
    image: ${NGINX_IMAGE:?NGINX_IMAGE puuttuu .env:stä}
    container_name: acme-nginx
    restart: unless-stopped
    user: "101:101"
    networks: [edge]
    ports:
      - "${NGINX_PUBLISH:-8080}:8080"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - acme-webroot:/usr/share/nginx/acme:ro,z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: journald
      options:
        tag: acme-nginx

  vault:
    <<: *hardening
    image: ${VAULT_IMAGE:?VAULT_IMAGE puuttuu .env:stä}
    container_name: acme-vault
    # Ei automaattista päivitystä (ei io.containers.autoupdate -labelia).
    # Sinetöity Vault ei kaadu, joten on-failure ei aiheuta uudelleenkäynnistyssilmukkaa.
    restart: on-failure:3
    user: "100:1000"
    network_mode: host
    # Kuunteluosoite muodostetaan ympäristöstä (HCL ei tue muuttujia); muu konfiguraatio vault.hcl:ssä.
    command:
      - sh
      - -ec
      - |
        {
          echo 'listener "tcp" {'
          echo "  address         = \"$$VAULT_LISTEN_ADDR\""
          echo "  cluster_address = \"127.0.0.1:$$VAULT_CLUSTER_PORT\""
          echo '  tls_cert_file   = "/vault/tls/vault.crt"'
          echo '  tls_key_file    = "/run/secrets/vault_tls_key"'
          echo '  tls_min_version = "tls12"'
          echo '}'
        } > /tmp/listener.hcl
        exec vault server -config=/vault/config/vault.hcl -config=/tmp/listener.hcl
    environment:
      VAULT_LISTEN_ADDR: ${VAULT_BIND_IP:?VAULT_BIND_IP puuttuu .env:stä}:${VAULT_PUBLISH_PORT:-8200}
      VAULT_CLUSTER_PORT: ${VAULT_CLUSTER_PORT:-8201}
      VAULT_API_ADDR: ${VAULT_API_ADDR:?VAULT_API_ADDR puuttuu .env:stä}
      VAULT_CLUSTER_ADDR: https://127.0.0.1:${VAULT_CLUSTER_PORT:-8201}
      # Kontin sisäiset CLI-komennot (healthcheck, podman exec); varmenteen SAN sisältää IP:n
      VAULT_ADDR: https://${VAULT_BIND_IP}:${VAULT_PUBLISH_PORT:-8200}
      VAULT_CACERT: /vault/tls/ca.pem
    volumes:
      - vault-data:/vault/file:Z
      - vault-audit:/vault/logs:Z
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - ${ACME_CONF_DIR:-./config}/tls/vault.crt:/vault/tls/vault.crt:ro
      - ${ACME_CONF_DIR:-./config}/tls/ca.pem:/vault/tls/ca.pem:ro
    secrets:
      # mode merkkijonona: YAML-luku 0400 = 256, jonka podman tulkitsee väärin
      - source: vault_tls_key
        uid: "100"
        gid: "1000"
        mode: "0400"
    tmpfs:
      # snapshotit (backup.sh/restore.sh) kulkevat /tmp:n kautta
      - /tmp:rw,noexec,nosuid,size=256m
    # vault status: 0 = unsealed, 2 = sinetöity -> "unhealthy" (ei uudelleenkäynnistystä).
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 15s
    logging:
      driver: journald
      options:
        tag: acme-vault

  lego:
    <<: *hardening
    image: ${LEGO_IMAGE:?LEGO_IMAGE puuttuu .env:stä}
    profiles: [jobs]
    restart: "no"
    network_mode: host
    environment:
      LEGO_SERVER: ${LEGO_SERVER:?LEGO_SERVER puuttuu .env:stä}
      LEGO_EMAIL: ${LEGO_EMAIL:?LEGO_EMAIL puuttuu .env:stä}
      KEY_TYPE: ${KEY_TYPE:-RSA2048}
      RENEW_DAYS: ${RENEW_DAYS:-30}
      PFX_COMPAT: ${PFX_COMPAT:-modern}
      VAULT_ADDR: https://${VAULT_BIND_IP}:${VAULT_PUBLISH_PORT:-8200}
      VAULT_CACERT: /etc/acme/vault-ca.pem
      LEGO_LOG_FORMAT: text
      # Välityspalvelin vain tähän konttiin; Vault ohitetaan aina.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${VAULT_BIND_IP},${NO_PROXY:-}
    volumes:
      - lego-data:/var/lib/lego:Z
      - acme-webroot:/var/www/acme:z
      - ${ACME_CONF_DIR:-./config}/certs.conf:/etc/acme/certs.conf:ro
      - ${ACME_CONF_DIR:-./config}/tls/ca.pem:/etc/acme/vault-ca.pem:ro
    secrets:
      - {source: vault_token, uid: "1000", gid: "1000", mode: "0400"}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    logging:
      driver: journald
      options:
        tag: acme-renew

networks:
  edge:
    internal: true
    # nginx ei tarvitse nimipalvelua: ei aardvark-dns:ää (ei DNS-vuotokanavaa, ei riippuvuutta resolv.confiin)
    x-podman.disable_dns: true

volumes:
  # Omistajat vastaavat kontin käyttäjiä (lego 1000, vault 100:1000).
  acme-webroot:
    driver_opts:
      o: uid=1000,gid=1000
  lego-data:
    driver_opts:
      o: uid=1000,gid=1000
  vault-data:
    driver_opts:
      o: uid=100,gid=1000
  vault-audit:
    driver_opts:
      o: uid=100,gid=1000

secrets:
  vault_tls_key:
    external: true
  vault_token:
    external: true
