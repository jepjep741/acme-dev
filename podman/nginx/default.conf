# nginx-kontti (nginx-unprivileged), kuuntelee 8080.
# Palomuuri ohjaa (DNAT) julkisten osoitteiden TCP 80 -> keskus :8080.
# Tarjoilee vain ACME HTTP-01 -haasteet; webroot on liitetty vain luku -tilassa.
server_tokens off;

server {
    listen 8080 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Kontin terveystarkistus. Ei rajausta lähdeosoitteella: rootless-portinohjaus
    # (rootlessport) näyttää lähdeosoitteena kontin oman osoitteen. Vastaus ei paljasta mitään.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Kaikki muu :80-liikenne HTTPS:ään samalle domainille
    location / {
        return 301 https://$host$request_uri;
    }
}
